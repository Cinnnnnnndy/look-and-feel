<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Look &amp; Feel</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo" aria-hidden="true">L</div>
        <div>
          <div class="brand-name">Look &amp; Feel</div>
          <div class="brand-sub" id="stat-count">设计素材库</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="entries">素材条目</button>
        <button class="nav-item" data-view="tags">标签</button>
        <a class="nav-item" id="nav-summary" target="_blank" rel="noopener">归纳总览</a>
        <a class="nav-item" id="nav-template" target="_blank" rel="noopener">条目模板</a>
      </nav>
      <div class="sidebar-foot">
        <a id="nav-repo" target="_blank" rel="noopener">GitHub 仓库 ↗</a>
      </div>
    </aside>

    <main class="main">
      <header class="welcome">
        <h1>欢迎回来</h1>
        <p>收集好设计，拆解视觉要点与交互设计点，沉淀为可复用的规律。</p>
      </header>

      <section class="actions">
        <a class="action" id="act-new" target="_blank" rel="noopener">
          <span class="action-icon">＋</span>
          <span class="action-title">新增条目</span>
          <span class="action-desc">从模板开始一条新分析</span>
        </a>
        <a class="action" id="act-summary" target="_blank" rel="noopener">
          <span class="action-icon">≡</span>
          <span class="action-title">查看归纳</span>
          <span class="action-desc">跨条目的视觉与交互规律</span>
        </a>
        <a class="action" id="act-repo" target="_blank" rel="noopener">
          <span class="action-icon">⌂</span>
          <span class="action-title">打开仓库</span>
          <span class="action-desc">浏览全部素材与历史</span>
        </a>
      </section>

      <section class="panel" id="view-entries">
        <div class="panel-head">
          <h2>最近收录</h2>
          <input id="search" class="search" type="search" placeholder="搜索产品名、主题、标签…">
        </div>
        <div id="tag-filter" class="tag-filter" hidden></div>
        <ul id="list" class="list"></ul>
      </section>

      <section class="panel" id="view-tags" hidden>
        <div class="panel-head"><h2>标签</h2></div>
        <div id="tag-cloud" class="tag-cloud"></div>
      </section>
    </main>
  </div>

  <script src="data/entries.js"></script>
  <script>
    (function () {
      var cfg = window.LF_CONFIG || {};
      var entries = (window.LF_ENTRIES || []).slice().sort(function (a, b) {
        return (b.date || "").localeCompare(a.date || "");
      });
      var blob = cfg.repo + "/blob/" + cfg.branch + "/";
      var tree = cfg.repo + "/tree/" + cfg.branch + "/";
      var activeTag = null;

      function $(id) { return document.getElementById(id); }
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      $("nav-summary").href = $("act-summary").href = blob + "SUMMARY.md";
      $("nav-template").href = $("act-new").href = blob + "entries/_template.md";
      $("nav-repo").href = $("act-repo").href = cfg.repo;
      $("stat-count").textContent = "已收录 " + entries.length + " 条";

      function render() {
        var q = $("search").value.trim().toLowerCase();
        var shown = entries.filter(function (e) {
          if (activeTag && (e.tags || []).indexOf(activeTag) < 0) return false;
          if (!q) return true;
          return [e.product, e.title, e.platform, (e.tags || []).join(" ")]
            .join(" ").toLowerCase().indexOf(q) >= 0;
        });

        var tf = $("tag-filter");
        tf.hidden = !activeTag;
        tf.innerHTML = activeTag
          ? '筛选标签：<span class="tag">' + esc(activeTag) + '</span> <button id="clear-tag">清除</button>'
          : "";
        if (activeTag) $("clear-tag").onclick = function () { activeTag = null; render(); };

        if (!shown.length) {
          $("list").innerHTML = '<li class="empty">' +
            (entries.length ? "没有匹配的条目" : "还没有收录任何素材。发来第一份设计素材吧。") + "</li>";
          return;
        }
        $("list").innerHTML = shown.map(function (e) {
          var cover = e.cover
            ? '<img class="thumb" loading="lazy" src="' + esc(e.cover) + '" alt="">'
            : '<div class="thumb thumb-ph">' + esc((e.product || "?").slice(0, 1)) + "</div>";
          var tags = (e.tags || []).map(function (t) {
            return '<button class="tag" data-tag="' + esc(t) + '">' + esc(t) + "</button>";
          }).join("");
          return '<li class="item">' + cover +
            '<div class="item-body">' +
              '<a class="item-title" target="_blank" rel="noopener" href="' + esc(tree + e.path) + '">' +
                esc(e.product) + (e.title ? '<span class="item-sub"> · ' + esc(e.title) + "</span>" : "") +
              "</a>" +
              '<div class="item-meta">' +
                '<span>' + esc(e.date) + "</span>" +
                (e.platform ? "<span>" + esc(e.platform) + "</span>" : "") +
                (e.link ? '<a target="_blank" rel="noopener" href="' + esc(e.link) + '">原链接 ↗</a>' : "") +
              "</div>" +
              '<div class="tags">' + tags + "</div>" +
            "</div></li>";
        }).join("");
      }

      function renderTags() {
        var count = {};
        entries.forEach(function (e) { (e.tags || []).forEach(function (t) { count[t] = (count[t] || 0) + 1; }); });
        var keys = Object.keys(count).sort(function (a, b) { return count[b] - count[a]; });
        $("tag-cloud").innerHTML = keys.length
          ? keys.map(function (t) {
              return '<button class="tag" data-tag="' + esc(t) + '">' + esc(t) + " <b>" + count[t] + "</b></button>";
            }).join("")
          : '<p class="empty">暂无标签</p>';
      }

      function show(view) {
        document.querySelectorAll(".nav-item[data-view]").forEach(function (b) {
          b.classList.toggle("active", b.dataset.view === view);
        });
        $("view-entries").hidden = view !== "entries";
        $("view-tags").hidden = view !== "tags";
      }

      $("nav").addEventListener("click", function (ev) {
        var v = ev.target.dataset && ev.target.dataset.view;
        if (v) show(v);
      });
      document.addEventListener("click", function (ev) {
        var t = ev.target.closest && ev.target.closest("[data-tag]");
        if (!t) return;
        activeTag = t.dataset.tag;
        show("entries");
        render();
      });
      $("search").addEventListener("input", render);

      render();
      renderTags();
    })();
  </script>
</body>
</html>
