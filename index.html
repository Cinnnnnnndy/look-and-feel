<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Look &amp; Feel</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo" aria-hidden="true">L</div>
        <div>
          <div class="brand-name">Look &amp; Feel</div>
          <div class="brand-sub" id="stat-count">设计素材库</div>
        </div>
      </div>
      <div class="side-label">产品场景</div>
      <nav class="scene-nav" id="scene-nav" aria-label="产品场景"></nav>
      <div class="side-label">资料</div>
      <nav class="nav">
        <a class="nav-item" id="nav-summary" target="_blank" rel="noopener">归纳总览 ↗</a>
        <a class="nav-item" id="nav-template" target="_blank" rel="noopener">条目模板 ↗</a>
        <a class="nav-item" id="nav-repo" target="_blank" rel="noopener">GitHub 仓库 ↗</a>
      </nav>
    </aside>

    <main class="main">
      <header class="welcome">
        <h1>欢迎回来</h1>
        <p>收集好设计，拆解视觉要点与交互设计点，沉淀为可复用的规律。</p>
      </header>

      <div class="toolbar">
        <div class="scene-tabs" id="scene-tabs" role="tablist" aria-label="按产品场景筛选"></div>
        <input id="search" class="search" type="search" placeholder="搜索产品名、主题、标签…">
      </div>
      <div id="tag-filter" class="tag-filter" hidden></div>

      <section id="grid" class="grid" aria-live="polite"></section>
    </main>
  </div>

  <script src="data/entries.js"></script>
  <script>
    (function () {
      var cfg = window.LF_CONFIG || {};
      var OTHER = "其他";
      var defined = window.LF_SCENES || [];
      var entries = (window.LF_ENTRIES || []).map(function (e) {
        var s = defined.indexOf(e.scene) >= 0 ? e.scene : OTHER;
        return Object.assign({}, e, { scene: s });
      }).sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
      var tree = cfg.repo + "/tree/" + cfg.branch + "/";
      var blob = cfg.repo + "/blob/" + cfg.branch + "/";
      var state = { scene: "全部", tag: null };

      function $(id) { return document.getElementById(id); }
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      // 每个场景一个固定色相，用于封面占位和场景标记
      function hue(scene) {
        var i = defined.indexOf(scene);
        return i < 0 ? 220 : (215 + i * 47) % 360;
      }

      $("nav-summary").href = blob + "SUMMARY.md";
      $("nav-template").href = blob + "entries/_template.md";
      $("nav-repo").href = cfg.repo;
      $("stat-count").textContent = "已收录 " + entries.length + " 条";

      var count = {};
      entries.forEach(function (e) { count[e.scene] = (count[e.scene] || 0) + 1; });
      var scenes = ["全部"].concat(defined.concat([OTHER]).filter(function (s) { return count[s]; }));
      count["全部"] = entries.length;

      function renderScenes() {
        var html = scenes.map(function (s) {
          var on = s === state.scene;
          return '<button role="tab" aria-selected="' + on + '" class="scene' + (on ? " on" : "") +
            '" data-scene="' + esc(s) + '" style="--h:' + hue(s) + '">' +
            (s === "全部" ? "" : '<i class="dot"></i>') + esc(s) +
            '<span class="n">' + count[s] + "</span></button>";
        }).join("");
        $("scene-tabs").innerHTML = html;
        $("scene-nav").innerHTML = html.replace(/role="tab" /g, "");
      }

      function card(e) {
        var cover = e.cover
          ? '<img class="cover" loading="lazy" src="' + esc(e.cover) + '" alt="">'
          : '<div class="cover cover-ph" aria-hidden="true">' + esc((e.product || "?").slice(0, 1)) + "</div>";
        var tags = (e.tags || []).map(function (t) {
          return '<button class="tag" data-tag="' + esc(t) + '">' + esc(t) + "</button>";
        }).join("");
        return '<article class="card" style="--h:' + hue(e.scene) + '">' + cover +
          '<div class="card-body">' +
            '<div class="card-scene"><i class="dot"></i>' + esc(e.scene) + "</div>" +
            '<h3><a class="card-link" target="_blank" rel="noopener" href="' + esc(tree + e.path) + '">' + esc(e.product) + "</a></h3>" +
            (e.title ? '<p class="card-title">' + esc(e.title) + "</p>" : "") +
            (e.summary ? '<p class="card-summary">' + esc(e.summary) + "</p>" : "") +
            '<div class="tags">' + tags + "</div>" +
            '<div class="card-meta"><span>' + esc(e.date) + "</span>" +
              (e.platform ? "<span>" + esc(e.platform) + "</span>" : "") +
              (e.link ? '<a class="raw" target="_blank" rel="noopener" href="' + esc(e.link) + '">原链接 ↗</a>' : "") +
            "</div>" +
          "</div></article>";
      }

      function render() {
        renderScenes();
        var q = $("search").value.trim().toLowerCase();
        var shown = entries.filter(function (e) {
          if (state.scene !== "全部" && e.scene !== state.scene) return false;
          if (state.tag && (e.tags || []).indexOf(state.tag) < 0) return false;
          if (!q) return true;
          return [e.product, e.title, e.summary, e.scene, e.platform, (e.tags || []).join(" ")]
            .join(" ").toLowerCase().indexOf(q) >= 0;
        });

        var tf = $("tag-filter");
        tf.hidden = !state.tag;
        tf.innerHTML = state.tag
          ? '标签：<span class="tag">' + esc(state.tag) + '</span><button class="clear" data-clear>清除</button>'
          : "";

        $("grid").innerHTML = shown.length ? shown.map(card).join("") :
          '<p class="empty">' + (entries.length ? "没有匹配的条目" : "还没有收录任何素材。发来第一份设计素材吧。") + "</p>";
      }

      document.addEventListener("click", function (ev) {
        var el = ev.target.closest && ev.target.closest("[data-scene],[data-tag],[data-clear]");
        if (!el) return;
        if (el.dataset.scene) state.scene = el.dataset.scene;
        else if (el.dataset.tag) state.tag = el.dataset.tag;
        else state.tag = null;
        render();
      });
      $("search").addEventListener("input", render);
      render();
    })();
  </script>
</body>
</html>
